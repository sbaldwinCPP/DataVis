
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Plot</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>Interactive 3D Plot</h1>
        <p>Use your mouse to rotate and zoom.</p>
    </div>
    <div class="container" id="plot-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Sample data for plotting
        // This can be replaced with any x, y, z data you want to visualize.
        const data = [
            { x: 10, y: 5, z: 8 },
            { x: -5, y: -10, z: -3 },
            { x: 15, y: 12, z: -5 },
            { x: -12, y: 7, z: 10 },
            { x: 0, y: 0, z: 0 },
            { x: 2, y: 8, z: -10 },
            { x: -8, y: -2, z: 12 },
            { x: 6, y: -6, z: 6 },
            { x: 14, y: 14, z: 14 },
            { x: -14, y: -14, z: -14 },
        ];
        
        // You can generate more data here if needed
        // for (let i = 0; i < 100; i++) {
        //     data.push({
        //         x: Math.random() * 20 - 10,
        //         y: Math.random() * 20 - 10,
        //         z: Math.random() * 20 - 10,
        //     });
        // }

        // === Three.js Setup ===

        // Scene, camera, and renderer
        const container = document.getElementById('plot-container');
        let scene, camera, renderer, controls;
        let points = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
            camera.position.z = 30;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.offsetWidth, container.offsetHeight);
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // For a smoother experience
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 1;
            controls.maxDistance = 100;

            // Add coordinate axes
            const axesHelper = new THREE.AxesHelper(20);
            scene.add(axesHelper);

            // Add a light source
            const light = new THREE.AmbientLight(0x404040); // Soft white light
            scene.add(light);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // Create points from data
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0x0077ff });

            data.forEach(pointData => {
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(pointData.x, pointData.y, pointData.z);
                points.push(sphere);
                scene.add(sphere);
            });

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = container.offsetWidth / container.offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.offsetWidth, container.offsetHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Only required if controls.enableDamping is set to true
            renderer.render(scene, camera);
        }

        // Initialize and start the animation loop
        init();
        animate();

    </script>
</body>
</html>
